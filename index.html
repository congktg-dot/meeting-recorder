<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Máy ghi âm cuộc họp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16222B;--mute:#5B6B77;--canvas:#EEF1F3;--line:#D9E0E5;--brand:#0E4A6B;--rec:#D8372F;--ok:#2F7D4F;--warn:#B0841B;--band:#10202B}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.55 'Be Vietnam Pro',system-ui,sans-serif}
.wrap{max-width:460px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--brand);color:#fff;padding:16px 22px}
header h1{margin:0;font-size:17px;font-weight:700}
header p{margin:2px 0 0;font-size:12.5px;opacity:.85}
header p.ok{opacity:1;color:#B8F0CF}
.band{background:var(--band);padding:16px 20px 6px}
canvas{display:block;width:100%;height:96px}
.state{color:#9FB4C2;font-size:13px;padding:6px 0 10px;display:flex;align-items:center;gap:8px}
.band.live .state{color:#fff}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.band.live .dot{background:var(--rec);animation:blink 1.2s infinite}
.band.paused .dot{background:var(--warn)}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.band.live .dot{animation:none}}
.timer{font-size:50px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:1px;text-align:center;padding:22px 0 4px}
.ctrls{display:flex;justify-content:center;gap:10px;padding:8px 20px 20px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 18px;cursor:pointer;font-weight:500}
.btn:hover{background:#F4F7F9}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:600}
.btn.dark{background:var(--band);border-color:var(--band);color:#fff}
.panel{border-top:1px solid var(--line);padding:20px 22px}
.panel audio{width:100%;margin:8px 0 14px}
.panel .row{display:flex;gap:10px;flex-wrap:wrap}
.msg{font-size:13.5px;color:var(--mute);margin-top:12px}
.err{margin:16px 22px;border:1px solid #F0C4C1;background:#FDF1F0;border-radius:8px;padding:14px 16px;color:#8E1F19;font-size:14px}
.foot{margin-top:auto;padding:14px 22px;color:var(--mute);font-size:12.5px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Máy ghi âm cuộc họp</h1>
    <p id="link">Đang kết nối với ứng dụng…</p>
  </header>

  <div class="band" id="band">
    <canvas id="wave" aria-label="Biểu đồ âm lượng"></canvas>
    <div class="state"><span class="dot"></span><span id="st">Đang chờ…</span></div>
  </div>
  <div class="timer" id="timer">00:00:00</div>
  <div class="ctrls" id="ctrls" hidden>
    <button class="btn" id="bPause">Tạm dừng</button>
    <button class="btn dark" id="bStop">Kết thúc</button>
  </div>

  <div class="err" id="err" hidden>
    <span id="errTxt"></span>
    <div style="margin-top:10px"><button class="btn primary" id="bRetry">Thử lại</button></div>
  </div>

  <div class="panel" id="recover" hidden>
    <b>Có một bản ghi chưa được lưu</b>
    <p class="msg" id="recTxt"></p>
    <div class="row">
      <button class="btn primary" id="bRecover">Khôi phục bản ghi</button>
      <button class="btn" id="bDiscard">Bỏ và ghi mới</button>
    </div>
  </div>

  <div class="panel" id="done" hidden>
    <b>Đã ghi xong</b>
    <audio id="prev" controls></audio>
    <div class="row">
      <button class="btn primary" id="bSend">Gửi về ứng dụng</button>
      <button class="btn" id="bDl">Tải file về máy</button>
      <button class="btn" id="bAgain">Ghi lại</button>
    </div>
    <p class="msg" id="sent"></p>
  </div>

  <div class="foot">Giữ cửa sổ này mở trong suốt cuộc họp. Bản ghi được giữ tạm trên máy và chỉ gửi về ứng dụng của bạn.</div>
</div>

<script>
const $ = s => document.querySelector(s);
/* Chỉ gửi dữ liệu cho cửa sổ đã mở trang này VÀ có nguồn thuộc Google Apps Script */
const ORIGIN_OK = o => /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(o) || o === 'https://script.google.com';

const fmt = s => { s = Math.max(0, Math.round(s||0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60, p = n => String(n).padStart(2,'0'); return `${p(h)}:${p(m)}:${p(x)}`; };
let stream, mr, ctx, an, chunks = [], acc = 0, t0 = 0, running = false, paused = false, tid = 0, bars = [];
let target = null, wake = null, blob = null, dur = 0, name = '', sessionId = 0;
const elapsed = () => acc + (running && !paused ? (performance.now()-t0)/1000 : 0);

/* ---------- Lưu tạm bằng IndexedDB để khôi phục khi cửa sổ bị đóng nhầm ---------- */
const idb = () => new Promise((ok, no) => { const r = indexedDB.open('meetrec', 1); r.onupgradeneeded = () => r.result.createObjectStore('chunks', { autoIncrement:true }); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const idbAdd = async v => { try { const d = await idb(); d.transaction('chunks','readwrite').objectStore('chunks').add(v); } catch(e){} };
const idbAll = async () => { const d = await idb(); return new Promise((ok, no) => { const q = d.transaction('chunks').objectStore('chunks').getAll(); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); }); };
const idbClear = async () => { try { const d = await idb(); d.transaction('chunks','readwrite').objectStore('chunks').clear(); } catch(e){} };

/* ---------- Giao tiếp với ứng dụng Apps Script ---------- */
const post = m => { try { if (target && window.opener && !window.opener.closed) window.opener.postMessage(m, target); } catch(e){} };
window.addEventListener('message', e => {
  if (e.source !== window.opener || !ORIGIN_OK(e.origin)) return;
  const m = e.data || {};
  if (m.type === 'HELLO'){
    target = e.origin; $('#link').textContent = 'Đã kết nối với ứng dụng biên bản họp'; $('#link').className = 'ok';
    if (blob) $('#bSend').click();
  } else if (target === e.origin && m.type === 'CMD'){
    if (m.cmd === 'pause' && running && !paused) togglePause();
    else if (m.cmd === 'resume' && running && paused) togglePause();
    else if (m.cmd === 'stop') stop();
  } else if (target === e.origin && m.type === 'ACK'){
    $('#sent').dataset.ok = '1'; $('#sent').textContent = 'Đã gửi về ứng dụng. Cửa sổ sẽ tự đóng.'; idbClear(); setTimeout(() => window.close(), 900);
  }
});
if (window.opener){
  let n = 0; const ping = () => { if (target || ++n > 14) return clearInterval(iv); try { window.opener.postMessage({ type:'READY' }, '*'); } catch(e){} };
  const iv = setInterval(ping, 800); ping();
} else {
  $('#link').textContent = 'Chạy độc lập: ghi xong hãy tải file về máy rồi chọn file trong ứng dụng.';
}

/* ---------- Giao diện ---------- */
const canvas = $('#wave'), g = canvas.getContext('2d');
function draw(){
  const r = devicePixelRatio || 1; canvas.width = canvas.clientWidth*r; canvas.height = canvas.clientHeight*r;
  const w = canvas.width, h = canvas.height, step = 5*r, n = Math.floor(w/step), b = bars.slice(-n);
  g.clearRect(0,0,w,h);
  for (let i=0;i<n;i++){ const v = b[b.length-n+i] ?? 0, bh = Math.max(3*r, v*h*0.92);
    g.fillStyle = (running && !paused) ? (i>n-4 ? '#FF6B63' : '#7FB8D9') : '#3A5568'; g.fillRect(i*step, (h-bh)/2, 3*r, bh); }
}
window.addEventListener('resize', draw);
function ui(mode){
  $('#band').classList.toggle('live', mode==='recording'); $('#band').classList.toggle('paused', mode==='paused');
  $('#st').textContent = { idle:'Đang chờ…', recording:'Đang ghi âm', paused:'Đã tạm dừng', done:'Đã ghi xong' }[mode];
  $('#ctrls').hidden = !(mode==='recording' || mode==='paused');
  $('#bPause').textContent = mode==='paused' ? 'Tiếp tục' : 'Tạm dừng';
  document.title = mode==='recording' ? '● Đang ghi âm' : 'Máy ghi âm cuộc họp';
}
function showErr(msg){ $('#errTxt').textContent = msg; $('#err').hidden = false; ui('idle'); post({ type:'ERROR', message: msg }); }

/* ---------- Ghi âm ---------- */
async function start(){
  $('#err').hidden = true; $('#recover').hidden = true; $('#done').hidden = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio:{ channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
  } catch(e){
    showErr('Chưa được phép dùng micro. Bấm biểu tượng ổ khóa cạnh thanh địa chỉ → cho phép Micrô, rồi bấm Thử lại.'); return;
  }
  const mt = ['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t => MediaRecorder.isTypeSupported(t));
  mr = new MediaRecorder(stream, mt ? { mimeType:mt, audioBitsPerSecond:32000 } : {});
  sessionId = Date.now(); chunks = []; bars = []; acc = 0;
  mr.ondataavailable = e => { if (e.data && e.data.size){ chunks.push(e.data); idbAdd({ s:sessionId, b:e.data }); } };
  mr.onstop = onStop; mr.start(1000);
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  an = ctx.createAnalyser(); an.fftSize = 1024; ctx.createMediaStreamSource(stream).connect(an);
  running = true; paused = false; t0 = performance.now();
  try { wake = await navigator.wakeLock.request('screen'); } catch(e){}
  ui('recording'); tid = setInterval(tick, 60);
}
function tick(){
  if (!running) return;
  let level = 0;
  if (!paused){
    const buf = new Uint8Array(an.fftSize); an.getByteTimeDomainData(buf);
    let s = 0; for (const x of buf){ const v = (x-128)/128; s += v*v; }
    level = Math.min(1, Math.sqrt(s/buf.length)*3.2); bars.push(level); if (bars.length > 900) bars.splice(0, 300);
  }
  draw(); const el = elapsed(); $('#timer').textContent = fmt(el);
  post({ type:'TICK', status: paused ? 'paused' : 'recording', elapsed: el, level });
}
function togglePause(){
  if (!running) return;
  if (!paused){ mr.pause(); acc += (performance.now()-t0)/1000; paused = true; ui('paused'); }
  else { mr.resume(); t0 = performance.now(); paused = false; ui('recording'); }
}
function stop(){
  if (!running) return;
  acc = elapsed(); running = false; clearInterval(tid);
  mr.stop(); stream.getTracks().forEach(t => t.stop());
  try { ctx.close(); } catch(e){} try { wake && wake.release(); } catch(e){}
}
function onStop(){
  const type = mr.mimeType || 'audio/webm';
  blob = new Blob(chunks, { type }); dur = acc;
  name = 'ghi-am-' + new Date().toISOString().slice(0,16).replace(/[-:T]/g,'') + (type.includes('mp4') ? '.m4a' : '.webm');
  showDone();
}
function showDone(){
  ui('done'); $('#done').hidden = false; $('#prev').src = URL.createObjectURL(blob); $('#timer').textContent = fmt(dur);
  $('#sent').textContent = ''; delete $('#sent').dataset.ok;
  if (target) $('#bSend').click(); else $('#sent').textContent = 'Chưa kết nối được ứng dụng. Hãy bấm "Tải file về máy" rồi chọn file trong ứng dụng.';
}

$('#bPause').onclick = togglePause; $('#bStop').onclick = stop; $('#bRetry').onclick = start;
$('#bSend').onclick = () => {
  if (!blob) return;
  if (target && window.opener && !window.opener.closed){
    window.opener.postMessage({ type:'DONE', blob, duration:dur, name, mime:(blob.type||'audio/webm').split(';')[0] }, target);
    $('#sent').textContent = 'Đang gửi về ứng dụng…';
    setTimeout(() => { if (!$('#sent').dataset.ok) $('#sent').textContent = 'Chưa nhận được xác nhận. Hãy bấm "Tải file về máy" để giữ bản ghi.'; }, 8000);
  } else $('#sent').textContent = 'Không kết nối được ứng dụng. Hãy tải file về máy rồi chọn file trong ứng dụng.';
};
$('#bDl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); a.remove(); };
$('#bAgain').onclick = async () => { if (confirm('Bỏ bản ghi này và ghi lại?')){ await idbClear(); blob = null; start(); } };
window.addEventListener('beforeunload', e => { if (running){ e.preventDefault(); e.returnValue = ''; } });

function getDuration(b){
  return new Promise(res => { const a = new Audio(); a.preload = 'metadata'; a.src = URL.createObjectURL(b);
    a.onloadedmetadata = () => { if (a.duration === Infinity){ a.currentTime = 1e101; a.ontimeupdate = () => { a.ontimeupdate = null; res(a.duration); }; } else res(a.duration); };
    a.onerror = () => res(0); });
}

/* ---------- Khởi động: khôi phục bản ghi dở (nếu có) hoặc ghi ngay ---------- */
(async () => {
  draw(); ui('idle'); let rows = [];
  try { rows = await idbAll(); } catch(e){}
  if (rows.length){
    const size = rows.reduce((s, r) => s + r.b.size, 0);
    $('#recTxt').textContent = `Dung lượng ${(size/1048576).toFixed(1)} MB, có thể do cửa sổ bị đóng giữa chừng.`;
    $('#recover').hidden = false;
    $('#bRecover').onclick = async () => {
      blob = new Blob(rows.map(r => r.b), { type: rows[0].b.type || 'audio/webm' });
      dur = await getDuration(blob); name = 'khoi-phuc-' + new Date().toISOString().slice(0,16).replace(/[-:T]/g,'') + '.webm';
      $('#recover').hidden = true; showDone();
    };
    $('#bDiscard').onclick = async () => { await idbClear(); start(); };
    post({ type:'TICK', status:'idle', elapsed:0, level:0 });
  } else start();
})();
</script>
</body>
</html>
